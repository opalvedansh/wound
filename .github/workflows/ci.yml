name: CI

on:
  push:
  pull_request:

jobs:
  model:
    name: Model service (wound-ai)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wound-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wound-ai/requirements.txt
      # CPU PyTorch: much smaller than the default CUDA build, and CI has no GPU.
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: API contract and flowchart rules
        run: python -m pytest tests -q
      - name: Smoke test (tiny synthetic training run through every script)
        run: python scripts/smoke_test.py

  apps:
    name: API, web and shared code
    runs-on: ubuntu-latest
    services:
      # Throwaway database for the migration check.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIRECT_URL: postgresql://postgres:ci@localhost:5432/ci
      NX_DAEMON: "false"
      NX_NO_CLOUD: "true"
      # The portal's build prerenders pages; the real values come from Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_API_URL: http://localhost:3333/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/mobile
      - run: npx prisma generate
      - name: Tests
        run: |
          npx jest -c packages/domain/jest.config.cts packages/domain
          npx jest -c apps/api/jest.config.cts apps/api/src
      - name: Type-check
        run: |
          npx tsc --noEmit -p apps/api/tsconfig.app.json
          npx tsc --noEmit -p apps/api/tsconfig.spec.json
          (cd apps/web && npx next typegen)
          npx tsc --noEmit -p apps/web/tsconfig.json
          npx tsc --noEmit -p apps/mobile/tsconfig.app.json
      - name: Migrations rebuild the schema exactly
        run: |
          # The roles Supabase has, which the lockdown migration revokes from.
          PGPASSWORD=ci psql -h localhost -U postgres -d ci -qc "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Production builds
        run: |
          npx nx build api
          npx nx build web
